amily="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">a person picks</text><text x="195.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">which ones to render</text><polyline points="340,485 385,485" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="385,485 372.7138441335348,491.71195754045885 372.7138441335348,478.28804245954115" fill="#FD5A02"/><polyline points="1200,320 1200,360 195,360 195,410" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="195,410 188.28804245954115,397.7138441335348 201.71195754045885,397.7138441335348" fill="#FD5A02"/><rect x="430" y="410" width="400" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="630.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Version A</text><text x="630.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">no subtitles</text><text x="630.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">for platforms that add their own</text><rect x="900" y="410" width="440" height="150" rx="16" fill="#202630" stroke="#FD5A02" stroke-width="3"/><text x="1120.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Version B</text><text x="1120.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">burned-in subtitles</text><text x="1120.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">chest height, word in color</text><polyline points="340,485 430,485" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="430,485 417.7138441335348,491.71195754045885 417.7138441335348,478.28804245954115" fill="#FD5A02"/><polyline points="195,560 195,620 1120,620 1120,560" fill="none" stroke="#FD5A02" stroke-width="4"/><polygon points="1120,560 1126.7119575404588,572.2861558664653 1113.2880424595412,572.2861558664653" fill="#FD5A02"/><text x="50" y="710" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#EDF0F4">Reframe 16:9 → 9:16 follows the face; every short is a crop of the 4K frame, so it stays sharp.</text></svg>
