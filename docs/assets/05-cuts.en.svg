<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img"><title>05 · How cuts are decided</title><rect width="1400" height="800" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">05 · How cuts are decided</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Every cut has a reason and a timestamp; nothing is rendered before approval</text><rect x="50" y="170" width="300" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Transcript</text><text x="200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">word timestamps</text><text x="200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">audio levels</text><rect x="470" y="150" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="171.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Silences</text><text x="670.0" y="201.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">≥ 0.6 s, keep 0.15 s each side</text><polyline points="350,245 420,245 420,186 470,186" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="470,186 457.7138441335348,192.71195754045885 457.7138441335348,179.28804245954115" fill="#D2601F"/><polyline points="870,186 930,186 930,245 990,245" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="990,245 977.7138441335347,251.71195754045885 977.7138441335347,238.28804245954115" fill="#D2601F"/><rect x="470" y="235" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="256.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Fillers</text><text x="670.0" y="286.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">configurable list per language</text><polyline points="350,245 420,245 420,271 470,271" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="470,271 457.7138441335348,277.71195754045885 457.7138441335348,264.28804245954115" fill="#D2601F"/><polyline points="870,271 930,271 930,245" fill="none" stroke="#D2601F" stroke-width="4"/><rect x="470" y="320" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="341.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Repeats</text><text x="670.0" y="371.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">same phrase said twice in a row</text><polyline points="350,245 420,245 420,356 470,356" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="470,356 457.7138441335348,362.71195754045885 457.7138441335348,349.28804245954115" fill="#D2601F"/><polyline points="870,356 930,356 930,245" fill="none" stroke="#D2601F" stroke-width="4"/><rect x="470" y="405" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="426.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Retakes</text><text x="670.0" y="456.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">read by assistant or person</text><polyline points="350,245 420,245 420,441 470,441" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="470,441 457.7138441335348,447.71195754045885 457.7138441335348,434.28804245954115" fill="#D2601F"/><polyline points="870,441 930,441 930,245" fill="none" stroke="#D2601F" stroke-width="4"/><rect x="990" y="170" width="350" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1165.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Merge</text><text x="1165.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">overlaps joined</text><text x="1165.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">keep list built</text><polyline points="1165,320 1165,540" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="1165,540 1158.2880424595412,527.7138441335347 1171.7119575404588,527.7138441335347" fill="#D2601F"/><rect x="990" y="540" width="350" height="130" rx="16" fill="#202630" stroke="#D2601F" stroke-width="3"/><text x="1165.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Cut list</text><text x="1165.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">reason + time for each</text><text x="1165.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">saved as JSON</text><rect x="520" y="540" width="350" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="695.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Approved?</text><text x="695.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">person confirms</text><text x="695.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">or edits the list</text><polyline points="990,605 870,605" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="870,605 882.2861558664653,598.2880424595412 882.2861558664653,611.7119575404588" fill="#D2601F"/><rect x="50" y="540" width="400" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="250.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Render</text><text x="250.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">one pass from the original</text><text x="250.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">no chain of re-encodes</text><polyline points="520,605 450,605" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="450,605 462.2861558664652,598.2880424595412 462.2861558664652,611.7119575404588" fill="#D2601F"/><text x="485" y="575" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">yes</text><polyline points="695,670 695,725 1165,725 1165,670" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="1165,670 1171.7119575404588,682.2861558664653 1158.2880424595412,682.2861558664653" fill="#D2601F"/><text x="930" y="750" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">adjust</text></svg>
