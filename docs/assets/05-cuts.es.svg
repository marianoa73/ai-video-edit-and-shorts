<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img"><title>05 · Cómo se deciden los cortes</title><rect width="1400" height="800" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">05 · Cómo se deciden los cortes</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Cada corte tiene un motivo y un tiempo; nada se renderiza antes de la aprobación</text><rect x="50" y="170" width="300" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Transcripción</text><text x="200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">tiempo por palabra</text><text x="200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">niveles de audio</text><rect x="470" y="150" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="171.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Silencios</text><text x="670.0" y="201.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">≥ 0,6 s, conserva 0,15 s a cada lado</text><polyline points="350,245 420,245 420,186 470,186" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="470,186 457.7138441335348,192.71195754045885 457.7138441335348,179.28804245954115" fill="#C0602B"/><polyline points="870,186 930,186 930,245 990,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="990,245 977.7138441335347,251.71195754045885 977.7138441335347,238.28804245954115" fill="#C0602B"/><rect x="470" y="235" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="256.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Muletillas</text><text x="670.0" y="286.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">lista configurable por idioma</text><polyline points="350,245 420,245 420,271 470,271" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="470,271 457.7138441335348,277.71195754045885 457.7138441335348,264.28804245954115" fill="#C0602B"/><polyline points="870,271 930,271 930,245" fill="none" stroke="#C0602B" stroke-width="4"/><rect x="470" y="320" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="341.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Repeticiones</text><text x="670.0" y="371.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">misma frase dicha dos veces seguidas</text><polyline points="350,245 420,245 420,356 470,356" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="470,356 457.7138441335348,362.71195754045885 457.7138441335348,349.28804245954115" fill="#C0602B"/><polyline points="870,356 930,356 930,245" fill="none" stroke="#C0602B" stroke-width="4"/><rect x="470" y="405" width="400" height="72" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="670.0" y="426.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" fill="#EDF0F4">Tomas falladas</text><text x="670.0" y="456.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">las lee un asistente o una persona</text><polyline points="350,245 420,245 420,441 470,441" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="470,441 457.7138441335348,447.71195754045885 457.7138441335348,434.28804245954115" fill="#C0602B"/><polyline points="870,441 930,441 930,245" fill="none" stroke="#C0602B" stroke-width="4"/><rect x="990" y="170" width="350" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1165.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Unir</text><text x="1165.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">se juntan los solapes</text><text x="1165.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">se arma lo que queda</text><polyline points="1165,320 1165,540" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1165,540 1158.2880424595412,527.7138441335347 1171.7119575404588,527.7138441335347" fill="#C0602B"/><rect x="990" y="540" width="350" height="130" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="1165.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Lista de cortes</text><text x="1165.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">motivo + tiempo de cada uno</text><text x="1165.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">guardada como JSON</text><rect x="520" y="540" width="350" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="695.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">¿Aprobada?</text><text x="695.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">una persona confirma</text><text x="695.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">o edita la lista</text><polyline points="990,605 870,605" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="870,605 882.2861558664653,598.2880424595412 882.2861558664653,611.7119575404588" fill="#C0602B"/><rect x="50" y="540" width="400" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="250.0" y="575.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Render</text><text x="250.0" y="605.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">una pasada desde el original</text><text x="250.0" y="635.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sin cadena de recompresiones</text><polyline points="520,605 450,605" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="450,605 462.2861558664652,598.2880424595412 462.2861558664652,611.7119575404588" fill="#C0602B"/><text x="485" y="575" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">sí</text><polyline points="695,670 695,725 1165,725 1165,670" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1165,670 1171.7119575404588,682.2861558664653 1158.2880424595412,682.2861558664653" fill="#C0602B"/><text x="930" y="750" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#EDF0F4">ajustar</text></svg>
