<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img"><title>03 · Tiempo de máquina estimado para un video de 30 min</title><rect width="1400" height="830" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">03 · Tiempo de máquina estimado para un video de 30 min</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">ESTIMACIONES, no mediciones · barra = típico, línea = mínimo–máximo · 5 shorts × 2 versiones</text><line x1="520.0" y1="130" x2="520.0" y2="698" stroke="#2b3340"/><text x="520.0" y="720" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">0 min</text><line x1="665.0" y1="130" x2="665.0" y2="698" stroke="#2b3340"/><text x="665.0" y="720" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">10 min</text><line x1="810.0" y1="130" x2="810.0" y2="698" stroke="#2b3340"/><text x="810.0" y="720" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">20 min</text><line x1="955.0" y1="130" x2="955.0" y2="698" stroke="#2b3340"/><text x="955.0" y="720" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">30 min</text><line x1="1100.0" y1="130" x2="1100.0" y2="698" stroke="#2b3340"/><text x="1100.0" y="720" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">40 min</text><line x1="1245.0" y1="130" x2="1245.0" y2="698" stroke="#2b3340"/><text x="1245.0" y="720" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">50 min</text><text x="50" y="168" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Preparar (análisis, HDR→SDR, proxy)</text><rect x="520" y="154" width="87.0" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="572.2" y1="168" x2="672.25" y2="168" stroke="#EDF0F4" stroke-width="3"/><text x="684.25" y="168" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">6.0 (3.6–10.5)</text><text x="50" y="230" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Extracción y limpieza de audio</text><rect x="520" y="216" width="13.05" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="528.7" y1="230" x2="546.1" y2="230" stroke="#EDF0F4" stroke-width="3"/><text x="558.1" y="230" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">0.9 (0.6–1.8)</text><text x="50" y="292" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Transcripción (medium, CPU)</text><rect x="520" y="278" width="478.5" height="28" rx="6" fill="#D2601F" stroke="none" stroke-width="0"/><line x1="868.0" y1="292" x2="1216.0" y2="292" stroke="#EDF0F4" stroke-width="3"/><text x="1228.0" y="292" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">33.0 (24.0–48.0)</text><text x="50" y="354" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Detección de cortes</text><rect x="520" y="340" width="8.7" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="524.35" y1="354" x2="537.4" y2="354" stroke="#EDF0F4" stroke-width="3"/><text x="549.4" y="354" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">0.6 (0.3–1.2)</text><text x="50" y="416" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">El asistente lee la transcripción</text><rect x="520" y="402" width="65.25" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="550.45" y1="416" x2="650.5" y2="416" stroke="#EDF0F4" stroke-width="3"/><text x="662.5" y="416" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">4.5 (2.1–9.0)</text><text x="50" y="478" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Seguimiento de cara (muestreado)</text><rect x="520" y="464" width="108.75" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="585.25" y1="478" x2="715.75" y2="478" stroke="#EDF0F4" stroke-width="3"/><text x="727.75" y="478" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">7.5 (4.5–13.5)</text><text x="50" y="540" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Render final (Quick Sync)</text><rect x="520" y="526" width="166.315" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="630.925" y1="540" x2="778.825" y2="540" stroke="#EDF0F4" stroke-width="3"/><text x="790.825" y="540" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">11.5 (7.7–17.9)</text><text x="50" y="602" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Zoom y paneo</text><rect x="520" y="588" width="36.974999999999994" height="28" rx="6" fill="#8a95a8" stroke="none" stroke-width="0"/><line x1="538.56" y1="602" x2="593.95" y2="602" stroke="#EDF0F4" stroke-width="3"/><text x="605.95" y="602" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">2.5 (1.3–5.1)</text><text x="50" y="664" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#EDF0F4">Render de shorts</text><rect x="520" y="650" width="271.875" height="28" rx="6" fill="#D2601F" stroke="none" stroke-width="0"/><line x1="683.125" y1="664" x2="955.0" y2="664" stroke="#EDF0F4" stroke-width="3"/><text x="967.0" y="664" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#BBC5D4">18.8 (11.2–30.0)</text><text x="50" y="790" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Total sin supervisión: típico 1 h 25 min (rango 55 min – 2 h 17 min) + unos 15 min de revisión humana</text></svg>
