<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img"><title>04 · Del video largo a los shorts</title><rect width="1400" height="800" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">04 · Del video largo a los shorts</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">El sistema propone; una persona elige; sólo se renderizan los shorts aprobados</text><rect x="50" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="230.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Transcripción</text><text x="195.0" y="260.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">palabras + tiempos</text><polyline points="340,245 385,245" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="385,245 372.7138441335348,251.71195754045885 372.7138441335348,238.28804245954115" fill="#D2601F"/><rect x="385" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Bloques de idea</text><text x="530.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sólo ideas completas</text><text x="530.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">nunca cortar a la mitad</text><polyline points="675,245 720,245" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="720,245 707.7138441335347,251.71195754045885 707.7138441335347,238.28804245954115" fill="#D2601F"/><rect x="720" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Puntaje</text><text x="865.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">gancho en la 1.ª frase</text><text x="865.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">20–60 s, cierre claro</text><polyline points="1010,245 1055,245" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="1055,245 1042.7138441335348,251.71195754045885 1042.7138441335348,238.28804245954115" fill="#D2601F"/><rect x="1055" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Ranking</text><text x="1200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">el asistente ordena</text><text x="1200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">con título y motivo</text><rect x="50" y="410" width="290" height="150" rx="16" fill="#202630" stroke="#D2601F" stroke-width="3"/><text x="195.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Aprobar</text><text x="195.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">una persona elige</text><text x="195.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">cuáles renderizar</text><polyline points="340,485 385,485" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="385,485 372.7138441335348,491.71195754045885 372.7138441335348,478.28804245954115" fill="#D2601F"/><polyline points="1200,320 1200,360 195,360 195,410" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="195,410 188.28804245954115,397.7138441335348 201.71195754045885,397.7138441335348" fill="#D2601F"/><rect x="430" y="410" width="400" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="630.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Versión A</text><text x="630.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">sin subtítulos</text><text x="630.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">para plataformas que ponen los suyos</text><rect x="900" y="410" width="440" height="150" rx="16" fill="#202630" stroke="#D2601F" stroke-width="3"/><text x="1120.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Versión B</text><text x="1120.0" y="485.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">subtítulos impresos</text><text x="1120.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">altura del pecho, palabra en color</text><polyline points="340,485 430,485" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="430,485 417.7138441335348,491.71195754045885 417.7138441335348,478.28804245954115" fill="#D2601F"/><polyline points="195,560 195,620 1120,620 1120,560" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="1120,560 1126.7119575404588,572.2861558664653 1113.2880424595412,572.2861558664653" fill="#D2601F"/><text x="50" y="710" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#EDF0F4">El reencuadre 16:9 → 9:16 sigue la cara; cada short es un recorte del cuadro 4K, así que mantiene la nitidez.</text></svg>
