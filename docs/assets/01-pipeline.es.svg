" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Lista de cortes</text><text x="195.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">qué se saca y por qué</text><text x="195.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">la aprueba una persona</text><polyline points="340,495 385,495" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="385,495 372.7138441335348,501.71195754045885 372.7138441335348,488.28804245954115" fill="#D2601F"/><rect x="385" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Montaje</text><text x="530.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">FFmpeg: cortar y unir</text><text x="530.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">micro-fundidos, volumen</text><polyline points="675,495 720,495" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="720,495 707.7138441335347,501.71195754045885 707.7138441335347,488.28804245954115" fill="#D2601F"/><rect x="720" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Aspecto</text><text x="865.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">zoom/paneo, fondo verde</text><text x="865.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">subtítulos sólo si se piden</text><polyline points="1010,495 1055,495" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="1055,495 1042.7138441335348,501.71195754045885 1042.7138441335348,488.28804245954115" fill="#D2601F"/><rect x="1055" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Archivo final</text><text x="1200.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">1080p H.264, CRF 18</text><text x="1200.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">originales intactos</text><polyline points="1200,320 1200,360 195,360 195,420" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="195,420 188.28804245954115,407.7138441335348 201.71195754045885,407.7138441335348" fill="#D2601F"/><rect x="50" y="690" width="1290" height="130" rx="16" fill="#202630" stroke="#D2601F" stroke-width="3"/><text x="695.0" y="725.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Shorts de la misma toma</text><text x="695.0" y="755.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">candidatos propuestos desde la transcripción → una persona aprueba → reencuadre 9:16 con seguimiento de cara</text><text x="695.0" y="785.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">dos versiones por short: sin y con subtítulos</text><polyline points="1200,570 1200,690" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="1200,690 1193.2880424595412,677.7138441335347 1206.7119575404588,677.7138441335347" fill="#D2601F"/></svg>
