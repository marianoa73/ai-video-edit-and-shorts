<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>01 · De una toma 4K cruda a los archivos finales</title><rect width="1400" height="900" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">01 · De una toma 4K cruda a los archivos finales</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Procesamiento local · un trabajo a la vez · nada se publica sin una persona</text><rect x="50" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Toma 4K cruda</text><text x="195.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">una grabación continua</text><text x="195.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">en carpeta compartida</text><polyline points="340,245 385,245" fill="none" stroke="#D2601F" stroke-width="4"/><polygon points="385,245 372.7138441335348,251.71195754045885 372.7138441335348,238.28804245954115" fill="#D2601F"/><rect x="385" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Preparar</text><text x="530.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">análisis, HDR a SDR</text><text x="530.0" y="275.0" do