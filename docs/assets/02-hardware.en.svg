<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>02 · Hardware and network (generic)</title><rect width="1400" height="900" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">02 · Hardware and network (generic)</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">A small x86 Linux box is enough; a GPU is an optional upgrade, not a requirement</text><rect x="50" y="190" width="220" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="160.0" y="240.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Phone</text><text x="160.0" y="270.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">4K30 recording</text><rect x="330" y="190" width="220" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="440.0" y="240.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Shared folder</text><text x="440.0" y="270.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">private LAN only</text><polyline points="270,255 330,255" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="330,255 317.7138441335348,261.71195754045885 317.7138441335348,248.28804245954115" fill="#C0602B"/><polyline points="550,255 620,255" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="620,255 607.7138441335347,261.71195754045885 607.7138441335347,248.28804245954115" fill="#C0602B"/><rect x="620" y="150" width="520" height="560" rx="20" fill="#171C24" stroke="#C0602B" stroke-width="3"/><text x="880" y="185" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#EDF0F4">Mini PC · Ubuntu 24.04 · x86_64</text><rect x="650" y="225" width="220" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="760.0" y="267.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">CPU</text><text x="760.0" y="297.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">4 cores / 8 threads</text><rect x="890" y="225" width="220" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1000.0" y="252.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">iGPU</text><text x="1000.0" y="282.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Quick Sync: decode</text><text x="1000.0" y="312.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">and encode video</text><rect x="650" y="360" width="220" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="760.0" y="387.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">RAM</text><text x="760.0" y="417.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">32 GB recommended</text><text x="760.0" y="447.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">16 GB with care</text><rect x="890" y="360" width="220" height="115" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1000.0" y="402.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">NVMe SSD</text><text x="1000.0" y="432.5" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">1 TB</text><text x="880" y="515" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">Whisper and face tracking run on the CPU;</text><text x="880" y="545" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">FFmpeg uses the iGPU for H.264/HEVC.</text><rect x="650" y="590" width="460" height="90" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="880.0" y="620.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Dedicated video volume</text><text x="880.0" y="650.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">≈ 200 GB, separate from the system</text><rect x="1190" y="190" width="170" height="130" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1275.0" y="240.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Reviewer</text><text x="1275.0" y="270.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">browser, LAN</text><polyline points="1140,255 1190,255" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1190,255 1177.7138441335348,261.71195754045885 1177.7138441335348,248.28804245954115" fill="#C0602B"/><rect x="50" y="430" width="400" height="140" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="250.0" y="470.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#EDF0F4">Language-model assistant</text><text x="250.0" y="500.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">reads transcript text only</text><text x="250.0" y="530.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">a local model is possible</text><polyline points="620,500 450,500" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="450,500 462.2861558664652,493.28804245954115 462.2861558664652,506.71195754045885" fill="#C0602B"/><text x="535" y="470" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#EDF0F4">text only</text><text x="535" y="532" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#EDF0F4">no audio/video</text><rect x="50" y="620" width="500" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="300.0" y="665.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Optional upgrade</text><text x="300.0" y="695.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">workstation + NVIDIA GPU</text><text x="300.0" y="725.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">faster Whisper and NVENC, if measured</text><text x="50" y="850" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">A UPS protects long renders; keep originals on a second disk until published.</text></svg>
