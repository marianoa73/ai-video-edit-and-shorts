<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>01 · From a raw 4K take to published files</title><rect width="1400" height="900" fill="#0F1115"/><text x="50" y="48" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="34" font-weight="700" fill="#EDF0F4">01 · From a raw 4K take to published files</text><text x="50" y="95" dominant-baseline="middle" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#BBC5D4">Local processing · one job at a time · nothing is published without a person</text><rect x="50" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="195.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Raw 4K take</text><text x="195.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">one continuous recording</text><text x="195.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">in a shared folder</text><polyline points="340,245 385,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,245 372.7138441335348,251.71195754045885 372.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="385" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Prepare</text><text x="530.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">probe, HDR to SDR</text><text x="530.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">proxy + clean audio</text><polyline points="675,245 720,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,245 707.7138441335347,251.71195754045885 707.7138441335347,238.28804245954115" fill="#C0602B"/><rect x="720" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Transcribe</text><text x="865.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">faster-whisper on CPU</text><text x="865.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">timestamp for every word</text><polyline points="1010,245 1055,245" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,245 1042.7138441335348,251.71195754045885 1042.7138441335348,238.28804245954115" fill="#C0602B"/><rect x="1055" y="170" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="215.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Detect cuts</text><text x="1200.0" y="245.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">silences and fillers</text><text x="1200.0" y="275.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">repeats and retakes</text><rect x="50" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="195.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Cut list</text><text x="195.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">what goes and why</text><text x="195.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">a person approves it</text><polyline points="340,495 385,495" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="385,495 372.7138441335348,501.71195754045885 372.7138441335348,488.28804245954115" fill="#C0602B"/><rect x="385" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="530.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Montage</text><text x="530.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">FFmpeg trim + join</text><text x="530.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">micro-fades, loudness</text><polyline points="675,495 720,495" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="720,495 707.7138441335347,501.71195754045885 707.7138441335347,488.28804245954115" fill="#C0602B"/><rect x="720" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="865.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Look</text><text x="865.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">zoom/pan, green screen</text><text x="865.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">subtitles only if wanted</text><polyline points="1010,495 1055,495" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1055,495 1042.7138441335348,501.71195754045885 1042.7138441335348,488.28804245954115" fill="#C0602B"/><rect x="1055" y="420" width="290" height="150" rx="16" fill="#202630" stroke="#596778" stroke-width="3"/><text x="1200.0" y="465.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Final file</text><text x="1200.0" y="495.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">1080p H.264, CRF 18</text><text x="1200.0" y="525.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">originals untouched</text><polyline points="1200,320 1200,360 195,360 195,420" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="195,420 188.28804245954115,407.7138441335348 201.71195754045885,407.7138441335348" fill="#C0602B"/><rect x="50" y="690" width="1290" height="130" rx="16" fill="#202630" stroke="#C0602B" stroke-width="3"/><text x="695.0" y="725.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#EDF0F4">Shorts from the same take</text><text x="695.0" y="755.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">candidates proposed from the transcript → person approves → 9:16 reframe with face tracking</text><text x="695.0" y="785.0" dominant-baseline="middle" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#BBC5D4">two versions per short: without and with subtitles</text><polyline points="1200,570 1200,690" fill="none" stroke="#C0602B" stroke-width="4"/><polygon points="1200,690 1193.2880424595412,677.7138441335347 1206.7119575404588,677.7138441335347" fill="#C0602B"/></svg>
